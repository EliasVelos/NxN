
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: 20px auto;
            background-color: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #498245;
            color: white;
        }

        a {
            color: #45824E;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .cadastrar {
            display: block;
            width: 80%;
            margin: 20px auto;
        }
    </style>

</head>

<body>

    <h2>Lista de Alunos Matriculados</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>E-mail</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="aluno : ${listAlunos}">

                <td th:text="${aluno.id_aluno}"></td>

                <td th:text="${aluno.nome_aluno}"></td>

                <td th:text="${aluno.cpf_aluno}"></td>

                <td th:text="${aluno.email_aluno}"></td>

                <td>
                    <a th:href="@{/aluno/editar/{id}(id=${aluno.id_aluno})}">
                        Editar
                    </a>

                    |

                    <a th:href="@{/aluno/excluir/{id}(id=${aluno.id_aluno})}"
                       onclick="return confirm('Tem certeza que deseja excluir?');">
                        Excluir
                    </a>
                </td>

            </tr>

        </tbody>

    </table>

    <a class="cadastrar" th:href="@{/aluno/formCadastrar}">
        + Cadastrar Novo Aluno
    </a>

</body>

</html>
