<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Cursos</title>

    <link rel="stylesheet" type="text/css" th:href="@{/css/listarTodos.css}" />

</head>

<body>

    <h2>Lista de Cursos Disponíveis</h2>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Nome do Curso</th>
                <th>Carga Horária</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="curso : ${listCurso}">

                <td th:text="${curso.id_curso}"></td>

                <td th:text="${curso.nome_curso}"></td>

                <td th:text="${curso.carga_horaria}"></td>

                <td th:text="${curso.descricao_curso}"></td>

                <td>
                    <a th:href="@{/curso/editar/{id}(id=${curso.id_curso})}">
                        Editar
                    </a>

                    |

                    <a th:href="@{/curso/excluir/{id}(id=${curso.id_curso})}"
                        onclick="return confirm('Tem certeza que deseja excluir este curso?');">
                        Excluir
                    </a>
                </td>

            </tr>

        </tbody>

    </table>

    <a class="cadastrar" th:href="@{/curso/formCadastrar}"> + Cadastrar Novo Curso</a>

    <a class="cadastrar" th:href="@{/}">DashBoard</a>

</body>

</html>
